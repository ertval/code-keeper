# ==============================================================================
# GitLab CI/CD Pipeline: Billing App Microservice
# Stages: Build, Test, Scan, Containerization, Deploy to Staging, Approval, Deploy to Production
# Security: Protected branch restricted, secret masking, least privilege, zero downtime
# ==============================================================================

stages:
  - Build
  - Test
  - Scan
  - Containerization
  - Deploy to Staging
  - Approval
  - Deploy to Production

variables:
  APP_NAME: "billing-app"
  IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  IMAGE_STAGING: "${CI_REGISTRY_IMAGE}:staging-latest"
  IMAGE_PROD: "${CI_REGISTRY_IMAGE}:production-latest"
  DOCKER_TLS_CERTDIR: "/certs"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
  ECS_CLUSTER_PROD: "code-keeper-production-cluster"

# Strict audit: main-only pipelines (no MR pipelines).
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

# ------------------------------------------------------------------------------
# Stage 1: Build
# ------------------------------------------------------------------------------
build:package:
  stage: Build
  image: python:3.11-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - srcs/billing-app/**/*
      when: on_success
    - when: never
  script:
    - echo "=== [Build] Compiling Bytecode & Validating Packaging ==="
    - pip install --no-cache-dir -r requirements.txt
    - python3 -m compileall -b .
  artifacts:
    paths:
      - requirements.txt
    expire_in: 1 day

# ------------------------------------------------------------------------------
# Stage 2: Test
# ------------------------------------------------------------------------------
test:unit:
  stage: Test
  image: python:3.11-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - srcs/billing-app/**/*
      when: on_success
    - when: never
  before_script:
    - pip install --no-cache-dir -r requirements.txt pytest pytest-cov
  script:
    - echo "=== [Test] Running Unit and Integration Test Suite ==="
    - pytest --cov=app --cov-report=term-missing --junitxml=junit-report.xml tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit-report.xml
    expire_in: 7 days

# ------------------------------------------------------------------------------
# Stage 3: Scan
# ------------------------------------------------------------------------------
scan:sast_bandit:
  stage: Scan
  image: python:3.11-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - srcs/billing-app/**/*
      when: on_success
    - when: never
  before_script:
    - pip install --no-cache-dir bandit
  script:
    - echo "=== [Scan] Executing Bandit AST Security Analysis ==="
    - bandit -r app/ -ll -ii -f screen
  allow_failure: false

scan:secret_detection:
  stage: Scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - srcs/billing-app/**/*
      when: on_success
    - when: never
  script:
    - echo "=== [Scan] Checking for Hardcoded Credentials / Secrets ==="
    - gitleaks detect --verbose --source . --no-git
  allow_failure: false

scan:trivy_fs:
  stage: Scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - srcs/billing-app/**/*
      when: on_success
    - when: never
  script:
    - echo "=== [Scan] Running Trivy Filesystem Vulnerability Scan ==="
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 .
  allow_failure: false

scan:sonarqube:
  stage: Scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - srcs/billing-app/**/*
      when: on_success
    - when: never
  script:
    - echo "=== [Scan] Running SonarQube Code Quality & Security Gate ==="
    - >
      if [ -n "${SONAR_HOST_URL:-}" ]; then
        sonar-scanner \
          -Dsonar.projectKey=code-keeper-billing-app \
          -Dsonar.sources=app \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.login="${SONAR_TOKEN}"
      else
        echo "WARNING: SonarQube credentials not configured; skipping remote upload (configure SONAR_HOST_URL/SONAR_TOKEN to enforce the gate)."
      fi
  allow_failure: false

# ------------------------------------------------------------------------------
# Stage 4: Containerization (Docker Build & Push - Protected Main Branch Only)
# ------------------------------------------------------------------------------
containerize:docker:
  stage: Containerization
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - echo "=== [Containerization] Building Docker Image ==="
    - docker build -t "${IMAGE_TAG}" -t "${IMAGE_STAGING}" .
    - echo "=== [Containerization] Scanning Built Image with Trivy ==="
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 "${IMAGE_TAG}"
    - echo "=== [Containerization] Pushing Image to Registry ==="
    - docker push "${IMAGE_TAG}"
    - docker push "${IMAGE_STAGING}"

# ------------------------------------------------------------------------------
# Stage 5: Deploy to Staging
# ------------------------------------------------------------------------------
deploy:staging:
  stage: Deploy to Staging
  image: amazon/aws-cli:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging
    url: https://staging.code-keeper.internal
  script:
    - echo "=== [CD] Deploying ${APP_NAME} to Staging Environment ==="
    - aws ecs update-service --cluster "${ECS_CLUSTER_STAGING}" --service "code-keeper-staging-${APP_NAME}" --force-new-deployment --region "${AWS_DEFAULT_REGION:-us-east-1}"
    - aws ecs wait services-stable --cluster "${ECS_CLUSTER_STAGING}" --services "code-keeper-staging-${APP_NAME}" --region "${AWS_DEFAULT_REGION:-us-east-1}"
    - curl -f --retry 5 --retry-delay 3 "http://staging.code-keeper.internal:8080/health"

# ------------------------------------------------------------------------------
# Stage 6: Approval (Manual Gate for Production Promotion)
# ------------------------------------------------------------------------------
approval:production:
  stage: Approval
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  allow_failure: false
  script:
    - echo "============================================================"
    - echo " Stakeholder Approval Confirmed for Production Deployment"
    - echo " Application:  ${APP_NAME}"
    - echo " Release Tag:  ${IMAGE_TAG}"
    - echo " Authorized by: ${GITLAB_USER_NAME} (${GITLAB_USER_EMAIL})"
    - echo "============================================================"

# ------------------------------------------------------------------------------
# Stage 7: Deploy to Production (Zero-Downtime Rolling Update)
# ------------------------------------------------------------------------------
deploy:production:
  stage: Deploy to Production
  image: amazon/aws-cli:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - approval:production
    - deploy:staging
  environment:
    name: production
    url: https://production.code-keeper.internal
  script:
    - echo "=== [CD] Executing Zero-Downtime Rolling Deployment to Production ==="
    - aws ecs update-service --cluster "${ECS_CLUSTER_PROD}" --service "code-keeper-production-${APP_NAME}" --force-new-deployment --region "${AWS_DEFAULT_REGION:-us-east-1}"
    - aws ecs wait services-stable --cluster "${ECS_CLUSTER_PROD}" --services "code-keeper-production-${APP_NAME}" --region "${AWS_DEFAULT_REGION:-us-east-1}"
    - curl -f --retry 10 --retry-delay 5 "http://production.code-keeper.internal:8080/health"
