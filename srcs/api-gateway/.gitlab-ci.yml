api-gateway:build:package:
  stage: Build
  # needs: [] starts the service chain at once instead of waiting for the infra
  # stages that come first in the root stages: list.
  needs: []
  image: python:3.11-alpine
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - when: never
  script:
  - echo "=== [Build] Compiling Bytecode & Validating Packaging ==="
  - pip install --no-cache-dir -r requirements.txt
  - python3 -m compileall -b .
    # Artifact paths are resolved from the project root, not from the service
    # directory, so they are declared service-relative and verified to exist.
  - 'test -f requirements.txt || { echo "ERROR: declared artifact requirements.txt not found in ${APP_DIR}"; exit 1; }'
  - 'test -f openapi.yaml || { echo "ERROR: declared artifact openapi.yaml not found in ${APP_DIR}"; exit 1; }'
  artifacts:
    paths:
    - srcs/api-gateway/requirements.txt
    - srcs/api-gateway/openapi.yaml
    expire_in: 1 day

# ------------------------------------------------------------------------------
# Stage 2: Test
# ------------------------------------------------------------------------------
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
api-gateway:test:unit:
  stage: Test
  needs:
  - api-gateway:build:package
  image: python:3.11-alpine
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - when: never
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  script:
  - echo "=== [Test] Running Unit and Integration Test Suite ==="
  - pip install --no-cache-dir -r requirements.txt pytest==9.1.1 pytest-cov==7.1.0
  - pytest --cov=app --cov-report=term-missing --junitxml=junit-report.xml tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: srcs/api-gateway/junit-report.xml
    expire_in: 7 days

# ------------------------------------------------------------------------------
# Stage 3: Scan
# ------------------------------------------------------------------------------
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
api-gateway:scan:sast_bandit:
  stage: Scan
  needs:
  - api-gateway:test:unit
  image: python:3.11-alpine
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - when: never
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  script:
  - echo "=== [Scan] Executing Bandit AST Security Analysis ==="
  - pip install --no-cache-dir bandit==1.9.4
  - bandit -r app/ -ll -ii -f screen
  allow_failure: false

  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
api-gateway:scan:secret_detection:
  stage: Scan
  needs:
  - api-gateway:test:unit
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - when: never
  script:
  - echo "=== [Scan] Checking for Hardcoded Credentials / Secrets ==="
  - gitleaks detect --verbose --source . --no-git
  allow_failure: false

  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
api-gateway:scan:trivy_fs:
  stage: Scan
  needs:
  - api-gateway:test:unit
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - when: never
  script:
  - echo "=== [Scan] Running Trivy Filesystem Vulnerability Scan ==="
  - trivy fs --severity HIGH,CRITICAL --exit-code 1 .
  allow_failure: false

  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
api-gateway:scan:sonarqube:
  stage: Scan
  needs:
  - api-gateway:test:unit
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/api-gateway/**/*
    when: on_success
  - when: never
  script:
  - echo "=== [Scan] Running SonarQube Code Quality & Security Gate ==="
  - >
    if [ -n "${SONAR_HOST_URL:-}" ]; then
      sonar-scanner \
        -Dsonar.projectKey=code-keeper-api-gateway \
        -Dsonar.sources=app \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.login="${SONAR_TOKEN}"
    else
      echo "WARNING: SonarQube credentials not configured; skipping remote upload (configure SONAR_HOST_URL/SONAR_TOKEN to enforce the gate)."
    fi
  allow_failure: false

# Advisory, non-blocking. pip-audit resolves its advisory database over the network and
# fails on an outage exactly like it fails on a real advisory, so it must not gate the
# promotion path. Every retry also makes the attempt non-idempotent (pip-audit writes
# pip-audit.log), which would defeat a caching retry strategy. The database-backed gate
# is scan:trivy_fs, which caches its DB in the Scan stage cache and runs offline-free.
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
api-gateway:scan:dependencies:
  stage: Scan
  # Runs on every pipeline, so the test job it follows may not exist.
  needs:
  - job: api-gateway:test:unit
    optional: true
  image: python:3.11-alpine
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: on_success
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    when: on_success
  - if: $CI_COMMIT_BRANCH
    when: on_success
  - when: never
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  script:
  - echo "=== [Scan] Reporting dependency advisories against requirements.txt (advisory only) ==="
  - pip install --no-cache-dir pip-audit==2.10.1
  - |
    if pip-audit -r requirements.txt; then
      echo "=== [Scan] No known advisory matches the pinned dependencies ==="
    else
      echo "=== [Scan] pip-audit reported findings or could not reach the advisory database ==="
      echo "=== [Scan] Not gating: see scan:trivy_fs for the blocking dependency gate ==="
    fi
  allow_failure: true

# ------------------------------------------------------------------------------
# Stage 4: Containerization (Docker Build & Push - Protected Main Branch Only)
# ------------------------------------------------------------------------------
# Kaniko builds and pushes straight to the registry as an unprivileged process:
# the runner is registered with privileged = false and without the Docker socket,
# so docker-in-docker cannot start here (see ansible/roles/gitlab_runner).
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
api-gateway:containerize:docker:
  stage: Containerization
  # The scans are optional needs because they only run when this service
  # changed. artifacts: false keeps their reports out of the build context.
  needs:
  - job: api-gateway:test:unit
    optional: true
    artifacts: false
  - job: api-gateway:scan:sast_bandit
    optional: true
    artifacts: false
  - job: api-gateway:scan:secret_detection
    optional: true
    artifacts: false
  - job: api-gateway:scan:trivy_fs
    optional: true
    artifacts: false
  - job: api-gateway:scan:sonarqube
    optional: true
    artifacts: false
  - job: api-gateway:scan:dependencies
    artifacts: false
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    when: on_success
  - when: never
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
    DOCKER_CONFIG: "/workspace/.docker"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  - mkdir -p "${DOCKER_CONFIG}"
  - printf '{"auths":{"https://index.docker.io/v1/":{"username":"%s","password":"%s"}}}' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" > "${DOCKER_CONFIG}/config.json"
  script:
  - echo "=== [Containerization] Building Docker Image with Kaniko (no privileged runner required) ==="
    # Pre-flight: kaniko resolves a relative --dockerfile against the build context, so
    # both the context and the Dockerfile must live in the same service directory. The
    # fail-fast checks make a wrong path an error instead of a silent cross-service build.
  - SERVICE_DIR="${CI_PROJECT_DIR}/${APP_DIR}"
  - 'test -d "${SERVICE_DIR}" || { echo "ERROR: service directory ${SERVICE_DIR} does not exist"; exit 1; }'
  - 'test -f "${SERVICE_DIR}/Dockerfile" || { echo "ERROR: no Dockerfile at ${SERVICE_DIR}/Dockerfile"; exit 1; }'
  - 'test -f "${SERVICE_DIR}/requirements.txt" || { echo "ERROR: no requirements.txt at ${SERVICE_DIR}/requirements.txt"; exit 1; }'
  - 'echo "Build context ${SERVICE_DIR} (Dockerfile: Dockerfile, context-relative)"'
  - /kaniko/executor --context "${SERVICE_DIR}" --dockerfile "Dockerfile" --destination "${IMAGE_TAG}" --cache=false
  - echo "=== [Containerization] Pushed immutable image ${IMAGE_TAG} ==="
  - echo "Release aliases are promoted by the CD stages, not by this job."

api-gateway:containerize:image_scan:
  stage: Containerization
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    when: on_success
  - when: never
  needs:
  - api-gateway:containerize:docker
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
    TRIVY_USERNAME: "${DOCKERHUB_USERNAME}"
    TRIVY_PASSWORD: "${DOCKERHUB_TOKEN}"
  script:
  - echo "=== [Containerization] Scanning published image ${IMAGE_TAG} with Trivy ==="
  - trivy image --severity HIGH,CRITICAL --exit-code 1 "${IMAGE_TAG}"
  allow_failure: false

# ------------------------------------------------------------------------------
# Stage 5: Deploy to Staging
# ------------------------------------------------------------------------------
api-gateway:deploy:staging:
  # The image scan must pass before staging runs the image, and when infra/
  # changed in the same push, the app goes out only after Terraform applied.
  needs:
  - job: api-gateway:containerize:docker
    artifacts: false
  - job: api-gateway:containerize:image_scan
    artifacts: false
  - job: infra:apply:staging
    optional: true
    artifacts: false
  stage: Deploy to Staging
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging
    url: https://staging.code-keeper.internal
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
    TASK_FAMILY: "code-keeper-staging-${APP_NAME}"
    SERVICE_NAME: "code-keeper-staging-${APP_NAME}"
    ALB_NAME: "code-keeper-staging-alb"
    TARGET_IMAGE: "${IMAGE_TAG}"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  # amazon/aws-cli has no tar or gzip, and the crane download below needs both.
  - command -v jq >/dev/null 2>&1 && command -v tar >/dev/null 2>&1 || (yum install -y -q jq tar gzip || microdnf install -y -q jq tar gzip)
  - command -v crane >/dev/null 2>&1 || (curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin crane)
  script:
  - echo "=== [CD] Deploying ${APP_NAME} to Staging Environment ==="
  - echo "=== [CD] Verifying ${TARGET_IMAGE} exists in the registry before touching the task definition ==="
  - |
    if ! printf '%s' "${DOCKERHUB_TOKEN}" | crane auth login "index.docker.io" -u "${DOCKERHUB_USERNAME}" --password-stdin >/dev/null 2>&1; then
      echo "ERROR: cannot authenticate to Docker Hub; refusing to mutate ${TASK_FAMILY}"; exit 1
    fi
  - 'crane digest "${TARGET_IMAGE}" >/dev/null 2>&1 || { echo "ERROR: ${TARGET_IMAGE} is not in the registry (was it built on this commit?); refusing to point ${TASK_FAMILY} at a missing image"; exit 1; }'
  - echo "=== [CD] Verifying ${TARGET_IMAGE} exists in the registry before touching the task definition ==="

  - echo "=== [CD] Describing the running task definition of ${APP_NAME} ==="
  - aws ecs describe-task-definition --task-definition "${TASK_FAMILY}" --region "${AWS_DEFAULT_REGION:-us-east-1}" --query taskDefinition --output json > taskdef.json
  - CURRENT_IMAGE=$(jq -r --arg container "${APP_NAME}" '.containerDefinitions[] | select(.name == $container) | .image' taskdef.json)
  - 'test -n "${CURRENT_IMAGE}" || { echo "ERROR: no container named ${APP_NAME} in task definition ${TASK_FAMILY}"; exit 1; }'
  - 'echo "Running image: ${CURRENT_IMAGE}"'
  - 'echo "Promoting to: ${TARGET_IMAGE}"'
  - |
    if [ "${CURRENT_IMAGE}" = "${TARGET_IMAGE}" ]; then
      echo "Task definition ${TASK_FAMILY} already runs ${TARGET_IMAGE}, nothing to promote."
    else
      jq --arg container "${APP_NAME}" --arg image "${TARGET_IMAGE}" '
        del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
            .registeredAt, .registeredBy, .deregisteredAt, .enableFaultInjection)
        | (.containerDefinitions[] | select(.name == $container) | .image) = $image
      ' taskdef.json > taskdef.patched.json
      NEW_TASKDEF=$(aws ecs register-task-definition --cli-input-json file://taskdef.patched.json --region "${AWS_DEFAULT_REGION:-us-east-1}" --query taskDefinition.taskDefinitionArn --output text)
      echo "Registered new task definition revision ${NEW_TASKDEF}"
      aws ecs update-service --cluster "${ECS_CLUSTER_STAGING}" --service "${SERVICE_NAME}" --task-definition "${NEW_TASKDEF}" --region "${AWS_DEFAULT_REGION:-us-east-1}"
    fi
  - aws ecs wait services-stable --cluster "${ECS_CLUSTER_STAGING}" --services "${SERVICE_NAME}" --region "${AWS_DEFAULT_REGION:-us-east-1}"
    # The ALB is the gateway's public entry point. Its DNS name is looked up in AWS,
    # so the probe follows whatever Terraform created.
  - ALB_DNS=$(aws elbv2 describe-load-balancers --names "${ALB_NAME}" --region "${AWS_DEFAULT_REGION}" --query 'LoadBalancers[0].DNSName' --output text)
  - curl -f --retry 5 --retry-delay 3 "http://${ALB_DNS}/health"

# ------------------------------------------------------------------------------
# Stage 6: Approval (Manual Gate for Production Promotion)
# ------------------------------------------------------------------------------
api-gateway:approval:production:
  stage: Approval
  needs:
  - api-gateway:deploy:staging
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  allow_failure: false
  script:
  - echo "============================================================"
  - echo " Stakeholder Approval Confirmed for Production Deployment"
  - 'echo " Application: ${APP_NAME}"'
  - 'echo " Release Tag: ${IMAGE_TAG}"'
  - 'echo " Authorized by: ${GITLAB_USER_NAME} (${GITLAB_USER_EMAIL})"'
  - echo "============================================================"

# ------------------------------------------------------------------------------
# Stage 7: Deploy to Production (Zero-Downtime Rolling Update)
# ------------------------------------------------------------------------------
# Moves the immutable commit tag onto the production-latest alias inside the
# registry (a registry side copy, so no Docker daemon is required), then the
# production service is rolled onto the immutable commit tag itself. The alias
# only records which release production runs: a reused tag would make every
# later release look like the image already running, so nothing would roll.
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
api-gateway:promote:image:
  stage: Deploy to Production
  image:
    # crane:0.20.2 does not exist, and the plain crane images have no shell, which
    # GitLab needs to run the script. The debug variant has a busybox shell; it is
    # a moving tag, so it is pinned by digest.
    name: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == "main"
  needs:
  - api-gateway:approval:production
  - api-gateway:deploy:staging
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
    DOCKER_CONFIG: "/workspace/.docker"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  - mkdir -p "${DOCKER_CONFIG}"
  - printf '{"auths":{"https://index.docker.io/v1/":{"username":"%s","password":"%s"}}}' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" > "${DOCKER_CONFIG}/config.json"
  script:
  - echo "=== [CD] Promoting ${IMAGE_TAG} to the ${IMAGE_PROD} release alias ==="
  - crane copy "${IMAGE_TAG}" "${IMAGE_PROD}"
  - 'SHA_DIGEST=$(crane digest "${IMAGE_TAG}") || { echo "ERROR: cannot resolve ${IMAGE_TAG}"; exit 1; }'
  - 'ALIAS_DIGEST=$(crane digest "${IMAGE_PROD}") || { echo "ERROR: cannot resolve ${IMAGE_PROD}"; exit 1; }'
  - 'test -n "${SHA_DIGEST}" || { echo "ERROR: empty digest for ${IMAGE_TAG}"; exit 1; }'
  - 'test "${SHA_DIGEST}" = "${ALIAS_DIGEST}" || { echo "ERROR: ${IMAGE_PROD} resolves to ${ALIAS_DIGEST} but ${IMAGE_TAG} is ${SHA_DIGEST}"; exit 1; }'
  - echo "=== [CD] ${IMAGE_PROD} -> ${ALIAS_DIGEST} (promoted from ${IMAGE_TAG}) ==="

api-gateway:deploy:production:
  # When infra/ changed in the same push, production gets the app only after
  # Terraform applied production, as in deploy:staging.
  stage: Deploy to Production
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == "main"
  needs:
  - api-gateway:approval:production
  - api-gateway:promote:image
  - api-gateway:deploy:staging
  - job: api-gateway:containerize:docker
    artifacts: false
  - job: infra:apply:production
    optional: true
    artifacts: false
  environment:
    name: production
    url: https://production.code-keeper.internal
  variables:
    APP_NAME: "api-gateway"
    APP_DIR: "srcs/api-gateway"
    DOCKERHUB_REPO: "grafido"
    IMAGE_TAG: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "docker.io/${DOCKERHUB_REPO}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "us-east-1"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
    TASK_FAMILY: "code-keeper-production-${APP_NAME}"
    SERVICE_NAME: "code-keeper-production-${APP_NAME}"
    ALB_NAME: "code-keeper-production-alb"
    TARGET_IMAGE: "${IMAGE_TAG}"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  # amazon/aws-cli has no tar or gzip, and the crane download below needs both.
  - command -v jq >/dev/null 2>&1 && command -v tar >/dev/null 2>&1 || (yum install -y -q jq tar gzip || microdnf install -y -q jq tar gzip)
  - command -v crane >/dev/null 2>&1 || (curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin crane)
  script:
  - echo "=== [CD] Executing Zero-Downtime Rolling Deployment to Production ==="

  - echo "=== [CD] Describing the running task definition of ${APP_NAME} ==="
  - aws ecs describe-task-definition --task-definition "${TASK_FAMILY}" --region "${AWS_DEFAULT_REGION:-us-east-1}" --query taskDefinition --output json > taskdef.json
  - CURRENT_IMAGE=$(jq -r --arg container "${APP_NAME}" '.containerDefinitions[] | select(.name == $container) | .image' taskdef.json)
  - 'test -n "${CURRENT_IMAGE}" || { echo "ERROR: no container named ${APP_NAME} in task definition ${TASK_FAMILY}"; exit 1; }'
  - 'echo "Running image: ${CURRENT_IMAGE}"'
  - 'echo "Promoting to: ${TARGET_IMAGE}"'
  - |
    if [ "${CURRENT_IMAGE}" = "${TARGET_IMAGE}" ]; then
      echo "Task definition ${TASK_FAMILY} already runs ${TARGET_IMAGE}, nothing to promote."
    else
      jq --arg container "${APP_NAME}" --arg image "${TARGET_IMAGE}" '
        del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
            .registeredAt, .registeredBy, .deregisteredAt, .enableFaultInjection)
        | (.containerDefinitions[] | select(.name == $container) | .image) = $image
      ' taskdef.json > taskdef.patched.json
      NEW_TASKDEF=$(aws ecs register-task-definition --cli-input-json file://taskdef.patched.json --region "${AWS_DEFAULT_REGION:-us-east-1}" --query taskDefinition.taskDefinitionArn --output text)
      echo "Registered new task definition revision ${NEW_TASKDEF}"
      aws ecs update-service --cluster "${ECS_CLUSTER_PROD}" --service "${SERVICE_NAME}" --task-definition "${NEW_TASKDEF}" --region "${AWS_DEFAULT_REGION:-us-east-1}"
    fi
  - aws ecs wait services-stable --cluster "${ECS_CLUSTER_PROD}" --services "${SERVICE_NAME}" --region "${AWS_DEFAULT_REGION:-us-east-1}"
    # The ALB is the gateway's public entry point. Its DNS name is looked up in AWS,
    # so the probe follows whatever Terraform created.
  - ALB_DNS=$(aws elbv2 describe-load-balancers --names "${ALB_NAME}" --region "${AWS_DEFAULT_REGION}" --query 'LoadBalancers[0].DNSName' --output text)
  - curl -f --retry 10 --retry-delay 5 "http://${ALB_DNS}/health"
