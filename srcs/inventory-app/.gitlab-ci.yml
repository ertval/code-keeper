inventory-app:build:package:
  stage: Build
  image: python:3.11-alpine
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - when: never
  script:
  - echo "=== [Build] Compiling Bytecode & Validating Packaging ==="
  - pip install --no-cache-dir -r requirements.txt
  - python3 -m compileall -b .
    # Artifact paths are resolved from the project root, not from the service
    # directory, so they are declared service-relative and verified to exist.
  - test -f requirements.txt || { echo "ERROR: declared artifact requirements.txt not found in ${APP_DIR}"; exit 1; }
  artifacts:
    paths:
    - srcs/inventory-app/requirements.txt
    expire_in: 1 day

# ------------------------------------------------------------------------------
# Stage 2: Test
# ------------------------------------------------------------------------------
  variables:
    APP_NAME: "inventory-app"
    APP_DIR: "srcs/inventory-app"
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "${CI_REGISTRY_IMAGE}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
inventory-app:test:unit:
  stage: Test
  image: python:3.11-alpine
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - when: never
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  - cd "${APP_DIR}"
  - pip install --no-cache-dir -r requirements.txt pytest pytest-cov
  script:
  - echo "=== [Test] Running Unit and Integration Test Suite ==="
  - pytest --cov=app --cov-report=term-missing --junitxml=junit-report.xml tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: srcs/inventory-app/junit-report.xml
    expire_in: 7 days

# ------------------------------------------------------------------------------
# Stage 3: Scan
# ------------------------------------------------------------------------------
  variables:
    APP_NAME: "inventory-app"
    APP_DIR: "srcs/inventory-app"
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "${CI_REGISTRY_IMAGE}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
inventory-app:scan:sast_bandit:
  stage: Scan
  image: python:3.11-alpine
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - when: never
  before_script:
  - 'echo "=== [CI] ${APP_NAME} : working from service directory ${APP_DIR} ==="'
  - cd "${APP_DIR}"
  - pwd
  - cd "${APP_DIR}"
  - pip install --no-cache-dir bandit
  script:
  - echo "=== [Scan] Executing Bandit AST Security Analysis ==="
  - bandit -r app/ -ll -ii -f screen
  allow_failure: false

  variables:
    APP_NAME: "inventory-app"
    APP_DIR: "srcs/inventory-app"
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "${CI_REGISTRY_IMAGE}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
    ECS_CLUSTER_STAGING: "code-keeper-staging-cluster"
    ECS_CLUSTER_PROD: "code-keeper-production-cluster"
inventory-app:scan:secret_detection:
  stage: Scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - srcs/inventory-app/**/*
    when: on_success
  - when: never
  script:
  - echo "=== [Scan] Checking for Hardcoded Credentials / Secrets ==="
  - gitleaks detect --verbose --source . --no-git
  allow_failure: false

  variables:
    APP_NAME: "inventory-app"
    APP_DIR: "srcs/inventory-app"
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
    IMAGE_PROD: "${CI_REGISTRY_IMAGE}/${APP_NAME}:production-latest"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
