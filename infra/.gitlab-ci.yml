cache:
  key: "${CI_COMMIT_REF_SLUG}-terraform"
  paths:
  - infra/environments/staging/.terraform
  - infra/environments/production/.terraform
  - infra/environments/staging/.terraform.lock.hcl
  - infra/environments/production/.terraform.lock.hcl

# ------------------------------------------------------------------------------
# Stage 1: Init
# ------------------------------------------------------------------------------
infra:init:staging:
  stage: Init
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - infra/**/*
    when: on_success
  - when: never
  script:
  - cd infra/environments/staging
  - 'test -n "${TF_STATE_BUCKET:-}" || { echo "ERROR: TF_STATE_BUCKET CI protected variable is unset"; exit 1; }'
  - 'test -n "${TF_STATE_REGION:-}" || { echo "ERROR: TF_STATE_REGION CI protected variable is unset"; exit 1; }'
  - 'test -n "${TF_STATE_LOCK_TABLE:-}" || { echo "ERROR: TF_STATE_LOCK_TABLE CI protected variable is unset"; exit 1; }'
  - >-
    terraform init -input=false
    -backend-config=backend.hcl
    -backend-config="bucket=${TF_STATE_BUCKET}"
    -backend-config="region=${TF_STATE_REGION}"
    -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
  # .terraform is deliberately NOT uploaded. The provider tree is 675 MB against a
  # 100 MB max_artifacts_size, so the upload would fail and take the whole Init
  # stage, and therefore every later stage, with it. Each job re-runs
  # `terraform init` against the cached lock file instead.
  artifacts:
    paths:
    - infra/environments/staging/.terraform.lock.hcl
    expire_in: 1 day

  variables:
    TF_VAR_image_repository_prefix: ${DOCKERHUB_REPO:-grafido}/${DOCKERHUB_PROJECT:-code-keeper}
    TF_VAR_release_tag: ${CI_COMMIT_SHORT_SHA}
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: &id001
    name: hashicorp/terraform:1.6
    entrypoint: [""]
  before_script:
  - terraform --version
infra:init:production:
  stage: Init
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - infra/**/*
    when: on_success
  - when: never
  script:
  - cd infra/environments/production
  - 'test -n "${TF_STATE_BUCKET:-}" || { echo "ERROR: TF_STATE_BUCKET CI protected variable is unset"; exit 1; }'
  - 'test -n "${TF_STATE_REGION:-}" || { echo "ERROR: TF_STATE_REGION CI protected variable is unset"; exit 1; }'
  - 'test -n "${TF_STATE_LOCK_TABLE:-}" || { echo "ERROR: TF_STATE_LOCK_TABLE CI protected variable is unset"; exit 1; }'
  - >-
    terraform init -input=false
    -backend-config=backend.hcl
    -backend-config="bucket=${TF_STATE_BUCKET}"
    -backend-config="region=${TF_STATE_REGION}"
    -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
  artifacts:
    paths:
    - infra/environments/production/.terraform.lock.hcl
    expire_in: 1 day

# ------------------------------------------------------------------------------
# Stage 2: Validate
# ------------------------------------------------------------------------------
  variables:
    TF_VAR_image_repository_prefix: ${DOCKERHUB_REPO:-grafido}/${DOCKERHUB_PROJECT:-code-keeper}
    TF_VAR_release_tag: ${CI_COMMIT_SHORT_SHA}
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
infra:validate:syntax:
  stage: Validate
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - infra/**/*
    when: on_success
  - when: never
  script:
  - cd infra
  - terraform fmt -check -recursive
  - cd environments/staging && terraform validate
  - cd ../production && terraform validate

  variables:
    TF_VAR_image_repository_prefix: ${DOCKERHUB_REPO:-grafido}/${DOCKERHUB_PROJECT:-code-keeper}
    TF_VAR_release_tag: ${CI_COMMIT_SHORT_SHA}
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
infra:validate:security:
  stage: Validate
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script:
  - terraform --version
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - infra/**/*
    when: on_success
  - when: never
  script:
    # infra/.trivyignore lists the accepted findings and why each is accepted. New
    # HIGH/CRITICAL findings still fail this gate.
  - trivy config --severity HIGH,CRITICAL --ignorefile infra/.trivyignore --exit-code 1 infra/
  allow_failure: false

  variables:
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
infra:validate:dependencies:
  stage: Validate
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
    when: on_success
  - when: never
  script:
  - echo "=== [Validate] Reporting outdated Terraform providers for dependency review ==="
  - cd infra/environments/staging
  - terraform init -backend=false -input=false
  - terraform outdated || echo "terraform outdated reported no comparable provider versions"
  allow_failure: true

# ------------------------------------------------------------------------------
# Stage 3: Plan
# ------------------------------------------------------------------------------
  variables:
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
infra:plan:staging:
  stage: Plan
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - infra/**/*
    when: on_success
  - when: never
  script:
  - cd infra/environments/staging
  - 'test -n "${TF_VAR_inventory_db_password:-}" || { echo "ERROR: TF_VAR_inventory_db_password CI masked var is unset"; exit 1; }'
  - 'test -n "${TF_VAR_billing_db_password:-}" || { echo "ERROR: TF_VAR_billing_db_password CI masked var is unset"; exit 1; }'
  - 'test -n "${TF_VAR_rabbitmq_password:-}" || { echo "ERROR: TF_VAR_rabbitmq_password CI masked var is unset"; exit 1; }'
  - terraform plan -input=false -out=staging.tfplan
  artifacts:
    name: "staging-tfplan-${CI_COMMIT_SHORT_SHA}"
    paths:
    - infra/environments/staging/staging.tfplan
    expire_in: 7 days

  variables:
    TF_VAR_image_repository_prefix: ${DOCKERHUB_REPO:-grafido}/${DOCKERHUB_PROJECT:-code-keeper}
    TF_VAR_release_tag: ${CI_COMMIT_SHORT_SHA}
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
infra:plan:production:
  stage: Plan
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
    when: on_success
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
      - infra/**/*
    when: on_success
  - when: never
  script:
  - cd infra/environments/production
  - 'test -n "${TF_VAR_inventory_db_password:-}" || { echo "ERROR: TF_VAR_inventory_db_password CI masked var is unset"; exit 1; }'
  - 'test -n "${TF_VAR_billing_db_password:-}" || { echo "ERROR: TF_VAR_billing_db_password CI masked var is unset"; exit 1; }'
  - 'test -n "${TF_VAR_rabbitmq_password:-}" || { echo "ERROR: TF_VAR_rabbitmq_password CI masked var is unset"; exit 1; }'
  - terraform plan -input=false -out=production.tfplan
  artifacts:
    name: "production-tfplan-${CI_COMMIT_SHORT_SHA}"
    paths:
    - infra/environments/production/production.tfplan
    expire_in: 7 days

# ------------------------------------------------------------------------------
# Stage 4: Apply to Staging (Automated on Protected Main Branch)
# ------------------------------------------------------------------------------
  variables:
    TF_VAR_image_repository_prefix: ${DOCKERHUB_REPO:-grafido}/${DOCKERHUB_PROJECT:-code-keeper}
    TF_VAR_release_tag: ${CI_COMMIT_SHORT_SHA}
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
infra:apply:staging:
  stage: Apply to Staging
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == "main"
  script:
  - cd infra/environments/staging
  - terraform apply -input=false -auto-approve staging.tfplan
  environment:
    name: staging
    url: https://staging.code-keeper.internal

# ------------------------------------------------------------------------------
# Stage 5: Approval (Manual Gate for Production Promotion)
# ------------------------------------------------------------------------------
  variables:
    TF_VAR_image_repository_prefix: ${DOCKERHUB_REPO:-grafido}/${DOCKERHUB_PROJECT:-code-keeper}
    TF_VAR_release_tag: ${CI_COMMIT_SHORT_SHA}
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
infra:approval:production:
  stage: Approval
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
  when: manual
  allow_failure: false
  script:
  - echo "============================================================"
  - echo " Production Deployment Approval Granted by Operator"
  - echo " Authorizing promotion of changes from staging to production"
  - 'echo " Commit: ${CI_COMMIT_SHA} by ${GITLAB_USER_NAME}"'
  - echo "============================================================"

# ------------------------------------------------------------------------------
# Stage 6: Apply to Production (Executes Only After Manual Approval)
# ------------------------------------------------------------------------------
  variables:
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
infra:apply:production:
  stage: Apply to Production
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  # Same changes: filter as infra:plan:production, so the plan this job needs
  # and the production.tfplan it applies exist whenever the job does.
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      paths:
      - infra/**/*
  needs:
  - infra:approval:production
  - infra:plan:production
  script:
  - cd infra/environments/production
  - terraform apply -input=false -auto-approve production.tfplan
  environment:
    name: production
    url: https://production.code-keeper.internal
  variables:
    TF_VAR_image_repository_prefix: ${DOCKERHUB_REPO:-grafido}/${DOCKERHUB_PROJECT:-code-keeper}
    TF_VAR_release_tag: ${CI_COMMIT_SHORT_SHA}
    TF_IN_AUTOMATION: "true"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  image: *id001
  before_script:
  - terraform --version
