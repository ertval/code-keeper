[pytest]
# srcs/billing-app/tests/test_validation.py and
# srcs/inventory-app/tests/test_validation.py share a basename and neither
# directory is a package, so pytest's default prepend import mode rejects the
# second with "import file mismatch". importlib mode keys each module by its
# full path, which is what lets both suites coexist in one run. The per-service
# pytest.ini files cannot solve this: they only apply when pytest is invoked
# with that directory as its rootdir.
addopts = --import-mode=importlib
testpaths = srcs
python_files = test_*.py
