---
- name: Install prerequisite packages for GitLab Runner and Docker
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - docker.io
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Check if GitLab Runner repository is present
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/runner_gitlab-runner.list
  register: gitlab_runner_repo_file

- name: Download GitLab Runner repository setup script (no curl|bash pipe)
  ansible.builtin.get_url:
    url: "{{ gitlab_runner_repo_script_url }}"
    dest: /tmp/gitlab-runner-repo-script.deb.sh
    mode: '0750'
    checksum: "{{ 'sha256:' + gitlab_runner_repo_script_sha256 if gitlab_runner_repo_script_sha256 | length > 0 else omit }}"
  when: not gitlab_runner_repo_file.stat.exists

- name: Add official GitLab Runner APT repository via pinned setup script
  ansible.builtin.command: bash /tmp/gitlab-runner-repo-script.deb.sh
  args:
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list
  when: not gitlab_runner_repo_file.stat.exists

- name: Install GitLab Runner and its helper images at the same pinned version
  ansible.builtin.apt:
    name:
      - "gitlab-runner-helper-images{{ '=' + gitlab_runner_version if gitlab_runner_version else '' }}"
      - "{{ gitlab_runner_package }}{{ '=' + gitlab_runner_version if gitlab_runner_version else '' }}"
    state: present
    update_cache: true
