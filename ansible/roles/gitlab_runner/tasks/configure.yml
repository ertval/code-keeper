---
# The concurrent setting now comes from config.toml.j2 (register.yml), so it is no
# longer patched in with lineinfile.
- name: Ensure gitlab-runner user is in docker group
  ansible.builtin.user:
    name: gitlab-runner
    groups: docker
    append: true

- name: Ensure GitLab Runner service is started and enabled
  ansible.builtin.systemd:
    name: gitlab-runner
    state: started
    enabled: true
