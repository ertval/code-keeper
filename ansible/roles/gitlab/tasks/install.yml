---
- name: Install prerequisite packages for GitLab
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
      - perl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Check if GitLab repository is already configured
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/gitlab_gitlab-ce.list
  register: gitlab_repo_file

- name: Download GitLab CE repository setup script (no curl|bash pipe)
  ansible.builtin.get_url:
    url: "{{ gitlab_repo_script_url }}"
    dest: /tmp/gitlab-repo-script.deb.sh
    mode: '0750'
    checksum: "{{ 'sha256:' + gitlab_repo_script_sha256 if gitlab_repo_script_sha256 | length > 0 else omit }}"
  when: not gitlab_repo_file.stat.exists

- name: Add GitLab CE APT repository via pinned setup script
  ansible.builtin.command: bash /tmp/gitlab-repo-script.deb.sh
  args:
    creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list
  when: not gitlab_repo_file.stat.exists

- name: Install GitLab CE package
  ansible.builtin.apt:
    name: "{{ gitlab_edition }}{{ '=' + gitlab_version if gitlab_version else '' }}"
    state: present
    update_cache: true
  environment:
    EXTERNAL_URL: "{{ gitlab_external_url }}"
