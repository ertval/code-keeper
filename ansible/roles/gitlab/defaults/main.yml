---
# Defaults for role: gitlab
gitlab_edition: "gitlab-ce"
# Pin the GitLab version for reproducible installs (empty = latest; set e.g. "16.11.0-ce.0" in production).
gitlab_version: ""
# APT repository setup script: downloaded to disk first (no curl|bash pipe) so
# it can be reviewed; pin its sha256 below once vendored for your release.
# Example: sha256sum /tmp/gitlab-repo-script.deb.sh -> paste digest here.
gitlab_repo_script_url: "https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh"
gitlab_repo_script_sha256: ""
gitlab_external_url: "http://gitlab.example.com"
# No default password committed. Must be provided via GITLAB_ROOT_PASSWORD
# environment variable (CI masked var). Playbooks assert it is set.
gitlab_root_password: "{{ lookup('env', 'GITLAB_ROOT_PASSWORD') }}"
gitlab_root_email: "admin@example.com"
gitlab_time_zone: "UTC"
gitlab_email_enabled: false

# GitLab Security & Access Defaults
gitlab_signup_enabled: false
gitlab_default_projects_limit: 50
gitlab_default_branch_name: "main"
# Applied by the cicd task to ApplicationSetting.default_branch_protection:
# 0 = fully unprotected, 1 = protected against pushes, 2 = fully protected.
gitlab_default_branch_protection: 2

# CI/CD Settings
gitlab_shared_runners_enabled: true
gitlab_artifacts_max_size: 100
gitlab_artifacts_expire_in: "30 days"
gitlab_auto_devops_enabled: false

# Omnibus Performance Tuning
gitlab_puma_workers: 2
gitlab_puma_min_threads: 1
gitlab_puma_max_threads: 4
gitlab_sidekiq_concurrency: 10
