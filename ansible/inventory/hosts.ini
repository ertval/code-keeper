# Example inventory for hosts that were not created with ansible/terraform (for
# example two local Ubuntu 22.04 or 24.04 VMs). With the Terraform, use the generated
# inventory/aws.ini instead, which ansible.cfg points to.
# Run with: ansible-playbook -i inventory/hosts.ini playbooks/site.yml
[gitlab_servers]
gitlab-server ansible_host=192.168.56.10

[gitlab_runners]
gitlab-runner-01 ansible_host=192.168.56.11

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
gitlab_external_url=http://192.168.56.10
