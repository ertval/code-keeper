[defaults]
roles_path = roles:../roles:ansible/roles
# Written by ansible/terraform (terraform apply). inventory/hosts.ini is an example
# for hosts that were not created with that Terraform.
inventory = inventory/aws.ini
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
# Keepalives every 30 s. The GitLab package install prints nothing for about 15 minutes,
# long enough for a home router to drop the idle connection and leave the play waiting
# forever for a result the host has already sent.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
