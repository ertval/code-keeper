---
# Playbook: Deploy and Configure GitLab CE
# Purpose: Automates full deployment of GitLab CE instance, user security, CI/CD parameters
- name: Deploy and Configure GitLab CE Instance
  hosts: gitlab_servers
  become: true
  gather_facts: true

  vars:
    # Overridable playbook-level defaults (no secrets committed here).
    gitlab_external_url: "{{ lookup('env', 'GITLAB_EXTERNAL_URL') | default('http://gitlab.example.com', true) }}"
    gitlab_root_password: "{{ lookup('env', 'GITLAB_ROOT_PASSWORD') }}"

  pre_tasks:
    - name: Fail when GitLab root password is not provided
      ansible.builtin.assert:
        that:
          - gitlab_root_password is defined
          - gitlab_root_password | length > 0
        fail_msg: "GITLAB_ROOT_PASSWORD env var (CI masked variable) must be set; no default password is committed."

  roles:
    - role: gitlab

  post_tasks:
    - name: Verify GitLab services status
      ansible.builtin.command: gitlab-ctl status
      register: gitlab_status
      changed_when: false

    - name: Print GitLab status
      ansible.builtin.debug:
        msg:
          - "GitLab instance successfully configured at {{ gitlab_external_url }}"
          - "Services status: {{ gitlab_status.stdout_lines | default(['Running']) }}"
