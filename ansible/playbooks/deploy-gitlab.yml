---
# Playbook: Deploy and Configure GitLab CE
# Purpose: Automates full deployment of GitLab CE instance, user security, CI/CD
# parameters, the code-keeper group and projects, and their CI/CD variables.
- name: Deploy and Configure GitLab CE Instance
  hosts: gitlab_servers
  become: true
  gather_facts: true

  vars:
    # No password is committed; it comes from the environment of the machine that
    # runs Ansible. gitlab_external_url comes from the inventory.
    gitlab_root_password: "{{ lookup('env', 'GITLAB_ROOT_PASSWORD') }}"

  pre_tasks:
    - name: Fail when GitLab root password is not provided
      ansible.builtin.assert:
        that:
          - gitlab_root_password is defined
          - gitlab_root_password | length >= 12
        fail_msg: "Set GITLAB_ROOT_PASSWORD (at least 12 characters) in the environment; no default password is committed."
        quiet: true

  roles:
    - role: gitlab

  post_tasks:
    - name: Verify GitLab services status
      ansible.builtin.command: gitlab-ctl status
      register: gitlab_status
      changed_when: false

    - name: Print GitLab status
      ansible.builtin.debug:
        msg:
          - "GitLab instance successfully configured at {{ gitlab_external_url }}"
          - "Projects: {{ gitlab_projects | map(attribute='path') | map('regex_replace', '^', gitlab_group_path ~ '/') | list }}"
          - "Services status: {{ gitlab_status.stdout_lines | default(['Running']) }}"
