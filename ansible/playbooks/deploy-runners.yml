---
# Playbook: Deploy and Register GitLab Runners
# Purpose: Docker executor runner installation, registration with a runner
# authentication token, and systemd management.
#
# Play 1 creates the short-lived admin API token on the GitLab host; play 2 uses it
# to create (or reuse) the instance runner in GitLab and writes the returned runner
# token into config.toml. No registration token is needed or committed.
- name: Create the API token for runner registration on the GitLab server
  hosts: gitlab_servers
  become: true
  gather_facts: false

  roles:
    - role: gitlab_api_token

- name: Deploy and Configure GitLab Runners
  hosts: gitlab_runners
  become: true
  gather_facts: true

  roles:
    - role: gitlab_runner

  post_tasks:
    - name: Check registered runners
      ansible.builtin.command: gitlab-runner list
      register: runner_status
      changed_when: false
      # The output contains the runner's authentication token; the summary below hides it.
      no_log: true

    - name: Verify GitLab Runner systemd daemon status
      ansible.builtin.systemd:
        name: gitlab-runner
        state: started
      register: runner_service

    - name: Print GitLab Runner verification summary
      ansible.builtin.debug:
        msg:
          - "GitLab Runner service active: {{ runner_service.status.ActiveState | default('active') }}"
          - >-
            Registered runners: {{ (runner_status.stderr_lines + runner_status.stdout_lines)
            | map('regex_replace', '\x1b\[[0-9;]*m', '')
            | map('regex_replace', 'Token=\S+', 'Token=<redacted>') | list }}
