# ==============================================================================
# Root pipeline for code-keeper (monorepo entry point)
#
# Why this file exists
# --------------------
# GitLab resolves exactly ONE CI entry point: .gitlab-ci.yml at the repository
# root. It never globs, walks, or merges pipeline files found in subdirectories.
#
# Before this file existed the repo carried four complete, individually valid
# pipeline definitions (infra/ and the three srcs/<service>/ directories) and
# GitLab would have reported "CI/CD configuration file not found" and created no
# pipeline at all -- not a failing pipeline, no pipeline. Every job in all four
# files was dead configuration, which is also why the repo's own audit tooling
# could report a green run while nothing executed.
#
# What merging them required
# --------------------------
# A naive `include:` of the four files would have looked fine and been badly
# broken, because a merged config has one namespace for job names, one `stages:`
# list, one `default:` block, and one flat `variables:` scope:
#
#   * 13 job names were defined in more than one file (build:package,
#     test:unit, deploy:staging, approval:production, ...). GitLab silently
#     keeps the LAST definition and discards the rest, so two of the three
#     services would have vanished from the pipeline entirely.
#   * `APP_NAME` / `APP_DIR` / `IMAGE_TAG` were defined identically in all three
#     service files. Last one wins -- so all three services would have built
#     and deployed billing-app.
#   * `default:` is not merged, it is replaced. The service files' default
#     `before_script: cd "${APP_DIR}"` would have been applied to the Terraform
#     jobs, and the infra file's `image: hashicorp/terraform:1.6` would have been
#     dropped from every job that relied on it.
#
# So the four files were converted into include fragments: every job renamed
# with a service prefix, and the file-level `stages:` / `default:` / `workflow:`
# / `variables:` hoisted into each job so nothing depends on a singleton. The
# union of stages and the shared workflow live here.
#
# Each fragment is still runnable as its own project pipeline: re-add the
# hoisted keys to run one service in isolation.
# ==============================================================================

stages:
  # infra/ (Terraform)
  - Init
  - Validate
  - Plan
  - Apply to Staging
  # srcs/* (build, test, scan, image, deploy)
  - Build
  - Test
  - Scan
  - Containerization
  - Deploy to Staging
  # shared gates
  - Approval
  - Deploy to Production
  - Apply to Production

# One workflow for the whole pipeline. Previously each of the four files carried
# its own identical copy, where last-one-wins made the effective rules depend on
# include order.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
    - when: never

include:
  - local: infra/.gitlab-ci.yml
  - local: srcs/api-gateway/.gitlab-ci.yml
  - local: srcs/inventory-app/.gitlab-ci.yml
  - local: srcs/billing-app/.gitlab-ci.yml

# ------------------------------------------------------------------------------
# Repo-level checks. These are the only jobs that can catch the class of defect
# this file exists to prevent: a pipeline definition that parses but that GitLab
# would never load. `scripts/verify_security.sh` and `scripts/test_pipelines.sh`
# both enumerate the nested files by explicit path, so they must learn about the
# root file too.
# ------------------------------------------------------------------------------

pipeline:lint:
  stage: Validate
  image: python:3.11-alpine
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - apk add --no-cache pyyaml
    - |
      echo "=== [CI] Every pipeline definition must parse, and the root must exist ==="
      test -f .gitlab-ci.yml || { echo "ERROR: no root .gitlab-ci.yml -- GitLab would create no pipeline"; exit 1; }
      for f in .gitlab-ci.yml infra/.gitlab-ci.yml \
               srcs/api-gateway/.gitlab-ci.yml \
               srcs/inventory-app/.gitlab-ci.yml \
               srcs/billing-app/.gitlab-ci.yml; do
        python -c "import yaml,sys; yaml.safe_load(open('$f'))" \
          || { echo "ERROR: $f does not parse"; exit 1; }
        echo "    OK  $f"
      done
    - |
      echo "=== [CI] A merged config has one job-name namespace: duplicates silently drop jobs ==="
      python - <<'PY'
      import yaml, collections, sys
      RESERVED = {"stages","default","variables","workflow","cache","include"}
      files = [".gitlab-ci.yml","infra/.gitlab-ci.yml",
               "srcs/api-gateway/.gitlab-ci.yml",
               "srcs/inventory-app/.gitlab-ci.yml",
               "srcs/billing-app/.gitlab-ci.yml"]
      seen = collections.Counter()
      for f in files:
          d = yaml.safe_load(open(f)) or {}
          for k, v in d.items():
              if k in RESERVED or not isinstance(v, dict):
                  continue
              seen[k] += 1
      dupes = {k: c for k, c in seen.items() if c > 1}
      if dupes:
          for k, c in dupes.items():
              print(f"    DUPLICATE job name '{k}' defined {c} times -- GitLab keeps only the last")
          sys.exit(1)
      print(f"    OK  {sum(seen.values())} uniquely named jobs")
      PY
    - |
      echo "=== [CI] Every referenced stage must exist in the root stages list ==="
      python - <<'PY'
      import yaml, sys
      root = yaml.safe_load(open(".gitlab-ci.yml")) or {}
      declared = set(root.get("stages") or [])
      RESERVED = {"stages","default","variables","workflow","cache","include"}
      missing = {}
      for f in ["infra/.gitlab-ci.yml","srcs/api-gateway/.gitlab-ci.yml",
                "srcs/inventory-app/.gitlab-ci.yml","srcs/billing-app/.gitlab-ci.yml"]:
          d = yaml.safe_load(open(f)) or {}
          for k, v in d.items():
              if k in RESERVED or not isinstance(v, dict):
                  continue
              s = v.get("stage")
              if s and s not in declared:
                  missing.setdefault(s, []).append(f"{f}:{k}")
      if missing:
          for s, jobs in missing.items():
              print(f"    STAGE '{s}' is used by {jobs} but not declared in the root")
          sys.exit(1)
      print(f"    OK  all stages resolve against {len(declared)} declared")
      PY
    - |
      echo "=== [CI] A job-level before_script REPLACES the default, it does not extend it ==="
      python - <<'PY'
      import yaml, sys
      f = "srcs/api-gateway/.gitlab-ci.yml"
      d = yaml.safe_load(open(f)) or {}
      RESERVED = {"stages","default","variables","workflow","cache","include"}
      bad = []
      for k, v in d.items():
          if k in RESERVED or not isinstance(v, dict):
              continue
          bs = v.get("before_script") or []
          if bs and not any('cd "${APP_DIR}"' in str(e) for e in bs):
              bad.append(k)
      if bad:
          print(f"    {f}: jobs missing the APP_DIR cd in before_script: {bad}")
          sys.exit(1)
      print("    OK  every job re-states its own working directory")
      PY